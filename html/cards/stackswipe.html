<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stack Swipe Cards</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #121a31;
  --text: #e6ecff;
  --accent: #7c9bff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: radial-gradient(circle at top, #1a2550, var(--bg));
  color: var(--text);
}
.stage {
  width: min(92vw, 760px);
  min-height: 320px;
  background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 36px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.title {
  margin: 0 0 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.subtitle {
  opacity: .7;
  font-size: 14px;
  margin: 0 0 20px;
}
.demo {
  display: grid;
  place-items: center;
  gap: 16px;
}
.btn,.chip,.card,.modal,.pill {
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08);
  color: var(--text);
}
.btn { padding: 12px 20px; font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.track { display: flex; gap: 10px; }
.tile { width: 64px; height: 64px; border-radius: 10px; background: rgba(124,155,255,.35); border: 1px solid rgba(255,255,255,.25); }
.deck{position:relative;width:180px;height:220px}
.sheet{position:absolute;inset:0;border-radius:14px;background:rgba(124,155,255,.35);border:1px solid rgba(255,255,255,.22);animation:swipe 3.2s ease-in-out infinite}
.sheet:nth-child(2){animation-delay:.3s}.sheet:nth-child(3){animation-delay:.6s}
@keyframes swipe{0%,20%{transform:translate(0,0) scale(1)}45%{transform:translate(130px,-20px) rotate(12deg);opacity:0}46%{transform:translate(-10px,8px) scale(.92);opacity:0}60%,100%{transform:translate(0,0) scale(1);opacity:1}}
  </style>
</head>
<body>
  <section class="stage">
    <div class="demo">
      <h1 class="title">Stack Swipe Cards</h1>
      <p class="subtitle">A stacked card deck that swipes through cards one-by-one.</p>
      <div class="deck"><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div></div>
    </div>
  </section>
</body>
</html>

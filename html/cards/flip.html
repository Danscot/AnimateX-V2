<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Card</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #121a31;
  --text: #e6ecff;
  --accent: #7c9bff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: radial-gradient(circle at top, #1a2550, var(--bg));
  color: var(--text);
}
.stage {
  width: min(92vw, 760px);
  min-height: 320px;
  background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 36px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.title {
  margin: 0 0 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.subtitle {
  opacity: .7;
  font-size: 14px;
  margin: 0 0 20px;
}
.demo {
  display: grid;
  place-items: center;
  gap: 16px;
}
.btn,.chip,.card,.modal,.pill {
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08);
  color: var(--text);
}
.btn { padding: 12px 20px; font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.track { display: flex; gap: 10px; }
.tile { width: 64px; height: 64px; border-radius: 10px; background: rgba(124,155,255,.35); border: 1px solid rgba(255,255,255,.25); }
.flip{width:160px;height:200px;perspective:800px}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flipY 3s ease-in-out infinite}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.12);backface-visibility:hidden;border:1px solid rgba(255,255,255,.2)}
.back{transform:rotateY(180deg);background:rgba(124,155,255,.25)}
@keyframes flipY{40%,60%{transform:rotateY(180deg)}}
  </style>
</head>
<body>
  <section class="stage">
    <div class="demo">
      <h1 class="title">Flip Card</h1>
      <p class="subtitle">A 3D card that flips on the Y axis to reveal back content.</p>
      <div class="flip"><div class="inner"><div class="face">Front</div><div class="face back">Back</div></div></div>
    </div>
  </section>
</body>
</html>

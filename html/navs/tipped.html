<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipped Navigation</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #121a31;
  --text: #e6ecff;
  --accent: #7c9bff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: radial-gradient(circle at top, #1a2550, var(--bg));
  color: var(--text);
}
.stage {
  width: min(92vw, 760px);
  min-height: 320px;
  background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 36px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.title {
  margin: 0 0 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.subtitle {
  opacity: .7;
  font-size: 14px;
  margin: 0 0 20px;
}
.demo {
  display: grid;
  place-items: center;
  gap: 16px;
}
.btn,.chip,.card,.modal,.pill {
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08);
  color: var(--text);
}
.btn { padding: 12px 20px; font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.track { display: flex; gap: 10px; }
.tile { width: 64px; height: 64px; border-radius: 10px; background: rgba(124,155,255,.35); border: 1px solid rgba(255,255,255,.25); }
.pill{position:relative;padding:10px 14px}
.pill::after{content:"Tip";position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:11px;padding:2px 6px;border-radius:999px;background:rgba(124,155,255,.35);opacity:0;animation:tipPulse 2.8s infinite}
.pill:nth-child(2)::after{animation-delay:.6s}.pill:nth-child(3)::after{animation-delay:1.2s}
@keyframes tipPulse{20%,45%{opacity:1;top:-30px}}
  </style>
</head>
<body>
  <section class="stage">
    <div class="demo">
      <h1 class="title">Tipped Navigation</h1>
      <p class="subtitle">Navigation labels with animated tooltip-like hints.</p>
      <div class="row"><div class="pill">Dashboard</div><div class="pill">Activity</div><div class="pill">Settings</div></div>
    </div>
  </section>
</body>
</html>

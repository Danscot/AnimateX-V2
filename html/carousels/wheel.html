<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel Carousel</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #121a31;
  --text: #e6ecff;
  --accent: #7c9bff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: radial-gradient(circle at top, #1a2550, var(--bg));
  color: var(--text);
}
.stage {
  width: min(92vw, 760px);
  min-height: 320px;
  background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 36px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.title {
  margin: 0 0 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.subtitle {
  opacity: .7;
  font-size: 14px;
  margin: 0 0 20px;
}
.demo {
  display: grid;
  place-items: center;
  gap: 16px;
}
.btn,.chip,.card,.modal,.pill {
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08);
  color: var(--text);
}
.btn { padding: 12px 20px; font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.track { display: flex; gap: 10px; }
.tile { width: 64px; height: 64px; border-radius: 10px; background: rgba(124,155,255,.35); border: 1px solid rgba(255,255,255,.25); }
.wheel{width:230px;height:230px;border:1px dashed rgba(255,255,255,.25);border-radius:50%;position:relative;animation:rot 12s linear infinite}
.item{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(124,155,255,.45);border:1px solid rgba(255,255,255,.3)}
.item:nth-child(1){top:-12px;left:92px}.item:nth-child(2){top:38px;right:-12px}.item:nth-child(3){bottom:38px;right:-12px}.item:nth-child(4){bottom:-12px;left:92px}.item:nth-child(5){bottom:38px;left:-12px}.item:nth-child(6){top:38px;left:-12px}
@keyframes rot{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <section class="stage">
    <div class="demo">
      <h1 class="title">Wheel Carousel</h1>
      <p class="subtitle">Items placed around a circle and rotating like a wheel.</p>
      <div class="wheel"><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div></div>
    </div>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swoop Text</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #121a31;
  --text: #e6ecff;
  --accent: #7c9bff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: radial-gradient(circle at top, #1a2550, var(--bg));
  color: var(--text);
}
.stage {
  width: min(92vw, 760px);
  min-height: 320px;
  background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 36px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.title {
  margin: 0 0 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.subtitle {
  opacity: .7;
  font-size: 14px;
  margin: 0 0 20px;
}
.demo {
  display: grid;
  place-items: center;
  gap: 16px;
}
.btn,.chip,.card,.modal,.pill {
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08);
  color: var(--text);
}
.btn { padding: 12px 20px; font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.track { display: flex; gap: 10px; }
.tile { width: 64px; height: 64px; border-radius: 10px; background: rgba(124,155,255,.35); border: 1px solid rgba(255,255,255,.25); }
.swoop{font-size:38px;font-weight:800;letter-spacing:.02em;animation:swoopText 2.2s ease-in-out infinite}
@keyframes swoopText{0%,100%{transform:translateX(-26px);opacity:.35}45%,70%{transform:none;opacity:1}}
  </style>
</head>
<body>
  <section class="stage">
    <div class="demo">
      <h1 class="title">Swoop Text</h1>
      <p class="subtitle">Display text that swoops in with eased horizontal motion.</p>
      <div class="swoop">AnimateX</div>
    </div>
  </section>
</body>
</html>
